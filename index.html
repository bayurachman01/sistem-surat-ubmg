<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="description" content="Sistem Informasi Surat Masuk dan Keluar Universitas Bina Mandiri Gorontalo">
    <title>Login - Sistem Surat UBMG</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-page">

    <!-- Panel Kiri - Branding -->
    <div class="login-left">
        <div class="login-brand">
            <img src="https://ubmg.ac.id/storage/website/ubmgicon.png" alt="Logo UBMG">
            <h1>Sistem Surat UBMG</h1>
            <div class="brand-divider"></div>
            <p>
                Sistem Informasi Manajemen Surat Masuk dan Keluar<br>
                Universitas Bina Mandiri Gorontalo
            </p>
        </div>
    </div>

    <!-- Panel Kanan - Form Login -->
    <div class="login-right">
        <div class="login-form-wrapper">
            <h2>Selamat Datang</h2>
            <p class="login-desc">Masuk ke akun Anda untuk mengakses sistem</p>

            <!-- Pesan Error -->
            <div id="login-error" class="login-error hidden">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                </svg>
                <span id="login-error-text">Username atau password salah.</span>
            </div>

            <form id="login-form" class="login-form" novalidate>

                <!-- Field Username -->
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-icon-wrapper">
                        <svg class="input-icon-left" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                        </svg>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Masukkan username"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <!-- Field Password -->
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-icon-wrapper">
                        <svg class="input-icon-left" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                        </svg>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="btn-toggle-password" id="btn-toggle-password" title="Tampilkan password">
                            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="17" height="17">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Tombol Login -->
                <button type="submit" id="btn-login" class="btn btn-primary btn-login">
                    <span id="btn-login-text">Masuk</span>
                    <span id="btn-login-loading" class="hidden">
                        <span class="spinner-inline"></span>
                        Memproses...
                    </span>
                </button>

            </form>

            <div class="login-footer">
                Universitas Bina Mandiri Gorontalo<br>
                Jl. Prof. Dr. H. Aloei Saboe No. 173, Gorontalo
            </div>
        </div>
    </div>

</div>

<!-- Script -->
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    // Redirect ke dashboard jika sudah login
    requireGuest();

    var loginForm      = document.getElementById("login-form");
    var btnLogin       = document.getElementById("btn-login");
    var btnLoginText   = document.getElementById("btn-login-text");
    var btnLoginLoading = document.getElementById("btn-login-loading");
    var loginError     = document.getElementById("login-error");
    var loginErrorText = document.getElementById("login-error-text");
    var btnTogglePass  = document.getElementById("btn-toggle-password");
    var passInput      = document.getElementById("password");

    // Toggle tampilkan/sembunyikan password
    btnTogglePass.addEventListener("click", function() {
        var isPassword = passInput.type === "password";
        passInput.type = isPassword ? "text" : "password";
        
        var eyeIcon = document.getElementById("eye-icon");
        if (isPassword) {
            // Ubah jadi mata terbuka (password terlihat)
            eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />';
            btnTogglePass.title = "Sembunyikan password";
        } else {
            // Ubah jadi mata tercoret (password tersembunyi)
            eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />';
            btnTogglePass.title = "Tampilkan password";
        }
    });

    // Handle submit form login
    loginForm.addEventListener("submit", async function(e) {
        e.preventDefault();

        var username = document.getElementById("username").value.trim();
        var password = document.getElementById("password").value.trim();

        if (!username || !password) {
            loginErrorText.textContent = "Username dan password wajib diisi.";
            loginError.classList.remove("hidden");
            return;
        }

        // Tampilkan loading
        btnLoginText.classList.add("hidden");
        btnLoginLoading.classList.remove("hidden");
        btnLogin.disabled = true;
        loginError.classList.add("hidden");

        var result = await apiLogin(username, password);

        // Sembunyikan loading
        btnLoginText.classList.remove("hidden");
        btnLoginLoading.classList.add("hidden");
        btnLogin.disabled = false;

        if (result.success) {
            saveSession(result.data);
            window.location.href = "dashboard.html";
        } else {
            loginErrorText.textContent = result.message || "Username atau password salah.";
            loginError.classList.remove("hidden");
        }
    });
</script>

</body>
</html>
